<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#05060c;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}

#userModal{position:relative;flex:1 1 0;min-height:0}

.row{display:flex;gap:6px;align-items:center;width:min(100%,620px);margin:0 auto}.row>label{font-size:11px;color:#ffffff80;width:34px;flex:none}.seg{display:flex;gap:5px;flex:1;min-width:0}
.seg button{flex:1;padding:8px 2px;border-radius:9px;background:#ffffff0d;border:1px solid #ffffff1a;font-size:12.5px;font-weight:700;color:#ffffffb3;white-space:nowrap}.seg button.on{background:#fff;color:#0b0d18;border-color:#fff}

.fx-cv{position:absolute;inset:0;z-index:85;pointer-events:none}.fx-flash{position:absolute;inset:0;z-index:84;pointer-events:none;animation:fxf linear both;mix-blend-mode:screen}@keyframes fxf{0%{opacity:.95}100%{opacity:0}}
.fx-shake{animation:fxs .5s cubic-bezier(.36,.07,.19,.97) both!important}@keyframes fxs{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-1deg)}40%,60%{transform:translate(7px,-3px) rotate(1deg)}}

@keyframes stampIn{0%{transform:translate(-50%,-50%) scale(3.2) rotate(-14deg);opacity:0}18%{transform:translate(-50%,-50%) scale(.92) rotate(-6deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-62%) scale(1.06) rotate(-6deg);opacity:0}}

/* ===== shared reel (original mechanic) — everything visual comes from theme tokens ===== */
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--tf);--bg:#0a0c16;--tx:#fff;--tx2:#ffffff99;--ac:#ffae1a;--fr:#ffffff22;--frw:1px;--win:#0b0d18;--tbg:#141726;--trad:14px;--tbd:1px solid #ffffff1f;--pn:#0d0f1c;--al:#ff3b1f;--tf:inherit;--shadow:0 14px 40px #000a;--fade:#000}
#stage:before,#stage:after{content:'';position:absolute;inset:0;pointer-events:none}
#stage .al{position:absolute;inset:0;pointer-events:none;z-index:7}#stage.alarm .al{animation:alarm .55s ease-out}@keyframes alarm{0%{box-shadow:inset 0 0 0 4px var(--al),inset 0 0 130px var(--al)}100%{box-shadow:inset 0 0 0 0 transparent}}
#ttl{flex:none;position:relative;z-index:3;margin-top:16px;font-size:15px;font-weight:800;letter-spacing:1px;text-align:center;padding:0 14px;color:var(--tx2)}#ttl b{color:var(--tx)}
#play{position:relative;z-index:2;flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#skip{flex:none;position:relative;z-index:3;margin:0 0 16px;min-width:min(260px,66%);padding:12px 24px;border-radius:var(--brad,30px);background:var(--sbg,#ffffff12);border:var(--sbd,1px solid #ffffff33);color:var(--stx,var(--tx));font-weight:900;letter-spacing:3px;font-size:13px;box-shadow:var(--ssh,none)}
.tl{position:relative;flex:none;width:var(--tw);height:var(--th);padding:calc(var(--tw)*.07);display:flex;align-items:center;justify-content:center}
.tl-b{position:relative;width:100%;height:100%;border-radius:var(--trad);background:var(--tbg);border:var(--tbd);overflow:hidden;display:grid;place-items:center;font-size:calc(var(--tw)*.4);box-shadow:var(--tsh,none);transition:transform .35s cubic-bezier(.2,1.6,.4,1),box-shadow .3s,opacity .3s}
.tl-b img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl-b:after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent,color-mix(in srgb,var(--tc) 72%,transparent));pointer-events:none}
.tl-t{position:absolute;left:11%;top:10%;z-index:1;padding:.08em .42em;border-radius:.4em;background:var(--tc);color:#fff;font-size:clamp(8px,calc(var(--tw)*.105),15px);font-weight:900;font-family:system-ui;line-height:1.35}
.tl.win{z-index:3}.tl.win .tl-b{transform:scale(1.14);box-shadow:0 0 0 2px #fff,0 0 22px var(--tc),0 0 60px color-mix(in srgb,var(--tc) 60%,transparent)}
.done .tl:not(.win) .tl-b,.cl-c.landed .tl:not(.win) .tl-b{opacity:.3}
.rl{position:relative;width:100%}.rl-w{position:relative;width:100%;height:var(--th);overflow:hidden;background:var(--win);border-top:var(--frw) solid var(--fr);border-bottom:var(--frw) solid var(--fr);box-shadow:var(--wsh,inset 0 0 40px #000)}
.rl-w:before,.rl-w:after{content:'';position:absolute;top:0;bottom:0;width:20%;z-index:2;pointer-events:none}.rl-w:before{left:0;background:linear-gradient(90deg,var(--fade),transparent)}.rl-w:after{right:0;background:linear-gradient(270deg,var(--fade),transparent)}
.rl-s{position:absolute;left:0;top:0;display:flex;will-change:transform}

.rl-l{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line,transparent);z-index:3}
.cls{display:flex;flex-direction:column;gap:12px;align-items:center}
.cl-p{position:relative;display:flex;gap:var(--cg);padding:0 var(--cpad);background:var(--pn);border:var(--frw) solid var(--fr);border-radius:var(--prad,18px);box-shadow:var(--shadow);overflow:hidden}
.cl-c{position:relative;width:var(--tw);height:calc(var(--th)*3);overflow:hidden}.cl-s{position:absolute;left:0;top:0;will-change:transform}
.cl-p:before,.cl-p:after{content:'';position:absolute;left:0;right:0;height:28%;z-index:2;pointer-events:none}.cl-p:before{top:0;background:linear-gradient(var(--fade),transparent)}.cl-p:after{bottom:0;background:linear-gradient(transparent,var(--fade))}

.cl-band:before,.cl-band:after{content:'';position:absolute;top:50%;margin-top:-9px;border:9px solid transparent;filter:drop-shadow(0 0 6px var(--ac))}.cl-band:before{left:2px;border-left:12px solid var(--ac)}.cl-band:after{right:2px;border-right:12px solid var(--ac)}

/* ===== ① NEON CYBER ===== */
#stage.t0{--bg:#04050d;--tx:#d8faff;--tx2:#5fe7ff;--ac:#00f0ff;--fr:#00f0ff;--win:#03040a;--tbg:#070b18;--trad:3px;--tbd:1px solid #00f0ff66;--tsh:inset 0 0 14px #00f0ff22;--pn:#03040a;--prad:4px;--al:#ff2bd6;--tf:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--line:#ff2bd6;--brad:3px;--sbg:transparent;--sbd:1px solid #00f0ff;--ssh:0 0 14px #00f0ff66,inset 0 0 14px #00f0ff22;--wsh:0 0 26px #00f0ff55,inset 0 0 40px #000;--shadow:0 0 26px #00f0ff44;--fade:#03040a;--pbg:#03040af2;--hc:#00f0ff;--hsh:3px 0 #ff2bd6,-3px 0 #00f0ff88,0 0 26px #00f0ff;--his:normal}
#stage.t0:before{background:linear-gradient(#00f0ff14 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,#00f0ff14 1px,transparent 1px) 0 0/34px 100%;-webkit-mask:radial-gradient(ellipse at 50% 55%,#000 20%,transparent 78%);mask:radial-gradient(ellipse at 50% 55%,#000 20%,transparent 78%);animation:gridmv 3s linear infinite}@keyframes gridmv{to{background-position:0 34px,34px 0}}
#stage.t0:after{background:repeating-linear-gradient(0deg,#00000055 0 1px,transparent 1px 3px);z-index:8;opacity:.6}
#stage.t0 .rl-p{display:none}#stage.t0 .rl-l{box-shadow:0 0 14px #ff2bd6,0 0 30px #ff2bd6}#stage.t0 #ttl{text-transform:uppercase;letter-spacing:3px;font-size:13px}#stage.t0 #ttl:before{content:'> '}
#stage.t0.alarm #play{animation:glitch .35s steps(3)}@keyframes glitch{0%{transform:translate(-6px,0) skewX(-4deg);filter:hue-rotate(60deg)}50%{transform:translate(6px,2px) skewX(3deg)}100%{transform:none;filter:none}}
/* ===== ② VEGAS GOLD ===== */
#stage.t1{--bg:radial-gradient(90% 70% at 50% 45%,#5a0a1c,#1a0308 78%);--tx:#fff3d1;--tx2:#e9c676;--ac:#ffcf4a;--fr:#d9a93a;--frw:6px;--win:#1c0509;--tbg:linear-gradient(#fff9e8,#f0dfb4);--trad:10px;--tbd:2px solid #c9972b;--tsh:0 4px 0 #7a5410,0 8px 14px #0008;--pn:#1c0509;--prad:16px;--al:#ffcf4a;--tf:Georgia,"Times New Roman","Songti SC",serif;--fade:#1c0509;--brad:8px;--sbg:linear-gradient(#ffe08a,#c9972b);--sbd:2px solid #fff3c4;--stx:#3a2500;--ssh:0 4px 0 #7a5410,0 10px 20px #0008;--pbg:radial-gradient(circle,#5a0a1cf5,#120206f7);--hc:#ffdf7e;--hsh:0 2px 0 #7a5410,0 0 30px #ffb300}
#stage.t1:before{background:repeating-linear-gradient(45deg,#ffffff07 0 2px,transparent 2px 22px),repeating-linear-gradient(-45deg,#ffffff07 0 2px,transparent 2px 22px)}
#stage.t1 .rl:before,#stage.t1 .rl:after,#stage.t1 .cls:before,#stage.t1 .cls:after{content:'';display:block;position:absolute;left:0;right:0;height:12px;z-index:5;background:radial-gradient(circle,#fff6c9 0 3.5px,#ffb300 4px 5px,transparent 5.5px) 0 0/26px 12px;animation:bulbs .5s steps(2) infinite;filter:drop-shadow(0 0 5px #ffcf4a)}
#stage.t1 .rl:before,#stage.t1 .cls:before{top:-24px}#stage.t1 .rl:after,#stage.t1 .cls:after{bottom:-24px;animation-delay:.25s}#stage.t1 .cls{position:relative}@keyframes bulbs{50%{background-position:13px 0;opacity:.55}}
#stage.t1 #ttl{font-size:17px;font-style:italic}
/* ===== ③ MATSURI 祭 ===== */
#stage.t2{--bg:#f3e9d6;--tx:#1d1a16;--tx2:#7a2a1e;--ac:#c8102e;--fr:#1f3a5f;--frw:5px;--win:#fbf6ea;--tbg:#fffdf7;--trad:4px;--tbd:1.5px solid #1d1a16;--tsh:3px 3px 0 #1d1a1622;--pn:#fbf6ea;--prad:6px;--al:#c8102e;--tf:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti SC",serif;--fade:#fbf6ea;--brad:4px;--sbg:#c8102e;--sbd:0;--stx:#fff;--ssh:4px 4px 0 #1d1a16;--shadow:6px 6px 0 #1f3a5f33;--wsh:none;--pbg:#f3e9d6f7;--ptx:#1d1a16;--hc:#c8102e;--hsh:none;--his:normal}
#stage.t2:before{background:radial-gradient(circle at 50% 44%,#c8102e 0 21%,transparent 21.4%),repeating-conic-gradient(from 0deg at 50% 44%,#c8102e14 0 6deg,transparent 6deg 12deg);opacity:.42}
#stage.t2:after{background:radial-gradient(circle at 50% 100%,transparent 9px,#1f3a5f44 9.5px 10.5px,transparent 11px,transparent 15px,#1f3a5f44 15.5px 16.5px,transparent 17px) 0 100%/38px 20px repeat-x;top:auto;height:20px;bottom:0}
#stage.t2 .tl-t{border-radius:50%;min-width:1.6em;text-align:center;font-family:inherit;box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--tc)}#stage.t2 .rl-p,#stage.t2 .cl-band:before,#stage.t2 .cl-band:after{filter:none}#stage.t2 .cl-band{box-shadow:none}
#stage.t2 .tl.win .tl-b{box-shadow:0 0 0 3px #c8102e,6px 6px 0 #1d1a16}#stage.t2 #ttl{font-size:16px;letter-spacing:4px}
/* ===== ④ GALAXY HOLO ===== */
#stage.t3{--bg:radial-gradient(60% 45% at 30% 30%,#5b2bd655,transparent 70%),radial-gradient(50% 40% at 78% 70%,#1fb6ff44,transparent 70%),linear-gradient(160deg,#0a0626,#050312 60%,#02010a);--tx:#f2ecff;--tx2:#b9a6ff;--ac:#9d7bff;--fr:#ffffff2e;--win:#ffffff0a;--tbg:linear-gradient(145deg,#ffffff24,#ffffff08);--trad:20px;--tbd:1px solid #ffffff40;--tsh:0 8px 26px #0008,inset 0 1px 0 #ffffff55;--pn:#ffffff0c;--prad:26px;--al:#38e8ff;--fade:#07041a;--sbg:linear-gradient(120deg,#9d7bff55,#38e8ff44);--sbd:1px solid #ffffff55;--ssh:0 0 24px #9d7bff66;--wsh:0 0 40px #9d7bff33;--pbg:radial-gradient(circle,#150a3cf2,#03010cf7);--hc:#fff;--hsh:0 0 18px #9d7bff,0 0 44px #38e8ff}
#stage.t3:before{background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#cfe3ff 1px,transparent 1.4px),radial-gradient(#fff 1.4px,transparent 2px);background-size:120px 140px,80px 90px,210px 190px;background-position:10px 20px,50px 70px,90px 30px;opacity:.5;animation:stars 40s linear infinite}@keyframes stars{to{background-position:10px 720px,50px 520px,90px 410px}}
#stage.t3.spin:after{background:repeating-linear-gradient(90deg,transparent 0 46px,#ffffff16 46px 48px,transparent 48px 120px);-webkit-mask:linear-gradient(90deg,#000,transparent 30%,transparent 70%,#000);mask:linear-gradient(90deg,#000,transparent 30%,transparent 70%,#000);animation:warp .35s linear infinite}@keyframes warp{to{background-position:-120px 0}}
#stage.t3 .tl-b:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,transparent 35%,#ffffff44 48%,#38e8ff33 52%,transparent 64%);background-size:260% 100%;animation:holo 2.6s linear infinite;mix-blend-mode:screen;pointer-events:none}@keyframes holo{from{background-position:140% 0}to{background-position:-60% 0}}
#stage.t3 .rl-p{width:14px;height:14px;margin-left:-7px;border:2px solid #38e8ff;border-radius:50%;box-shadow:0 0 14px #38e8ff;filter:none}#stage.t3 .rl-p.t{top:-9px}#stage.t3 .rl-p.b{bottom:-9px}#stage.t3 .rl-l{background:linear-gradient(#38e8ff,#9d7bff,#38e8ff);opacity:.7}
/* ===== ⑤ CANDY POP ===== */
#stage.t4{--bg:linear-gradient(160deg,#ffd6ec,#fff3b8 50%,#b8f3e4);--tx:#3b1d5c;--tx2:#8a4fd1;--ac:#ff4fa3;--fr:#3b1d5c;--frw:4px;--win:#fff;--tbg:#fff;--trad:22px;--tbd:3px solid #3b1d5c;--tsh:0 5px 0 #3b1d5c;--pn:#fff;--prad:28px;--al:#ff4fa3;--tf:"Arial Rounded MT Bold","Baloo 2","Nunito","PingFang SC",system-ui,sans-serif;--fade:#fff;--brad:30px;--sbg:#7b5cff;--sbd:3px solid #3b1d5c;--stx:#fff;--ssh:0 5px 0 #3b1d5c;--shadow:0 8px 0 #3b1d5c;--wsh:none;--pbg:linear-gradient(160deg,#ffd6ecf7,#fff3b8f7,#b8f3e4f7);--ptx:#3b1d5c;--hc:#ff4fa3;--hsh:3px 3px 0 #3b1d5c;--his:normal}
#stage.t4:before{background:radial-gradient(#ffffffb3 7px,transparent 8px) 0 0/54px 54px,radial-gradient(#ff4fa322 10px,transparent 11px) 27px 27px/108px 108px;animation:dots 9s linear infinite}@keyframes dots{to{background-position:54px 54px,135px 135px}}
#stage.t4 .rl-p{filter:none;margin-left:-14px;border-left-width:14px;border-right-width:14px}#stage.t4 .rl-p.t{border-top-width:20px;top:-10px}#stage.t4 .rl-p.b{border-bottom-width:20px;bottom:-10px}

<div id="userPane">
 <div id="bar"></div>
 <div id="userModal"><div id="stage" class="fx-target t0"><i class="al"></i><div id="ttl"></div><div id="play"></div><button id="skip">SKIP</button></div></div>
 <div id="ctl"><div class="row"><label>抽数</label><div class="seg" id="cnt"></div></div><div class="row"><label>结果</label><div class="seg" id="out"></div></div><div class="row"><button id="go">开始抽奖</button><button id="mute">🔊</button></div></div>
</div>
<script>
window.UI = { mute: false };
/* ================= FX ENGINE: particles · flash · shake · stamp · sound · micro-interactions ================= */
const RM_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX = (() => {
  let cv, ctx, parts = [], raf = 0;
  const host = () => document.getElementById('userPane');
  function ensure() {
    const h = host(); if (!cv || !h.contains(cv)) { cv = document.createElement('canvas'); cv.className = 'fx-cv'; h.appendChild(cv); ctx = cv.getContext('2d'); }
    const r = h.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    if (cv.width !== Math.round(r.width * d) || cv.height !== Math.round(r.height * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); }
    return r;
  }
  function pos(el) { const r = host().getBoundingClientRect(); if (!el) return { x: r.width / 2, y: r.height / 2 }; const e = el.getBoundingClientRect(); return { x: e.left - r.left + e.width / 2, y: e.top - r.top + e.height / 2 }; }
  function loop() {
    const r = ensure(); ctx.clearRect(0, 0, r.width, r.height);
