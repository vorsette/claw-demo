<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#14171d;color:#e8ebf2;font-family:"Roboto Condensed","Arial Narrow","PingFang SC","Noto Sans SC",system-ui,sans-serif;overflow:hidden}

.pay h2{font-size:clamp(20px,6.5cqi,32px);font-weight:800;letter-spacing:3px;text-transform:uppercase;animation:payin .45s cubic-bezier(.2,1.4,.4,1)}@keyframes payin{from{transform:scale(.5);opacity:0}}

<div id="userPane">
 <div id="bar"></div>
 <div id="userModal"><div id="stage" class="fx-target"><div id="ttl"></div><div id="play"></div><button id="skip">SKIP</button></div></div>
 <div id="ctl"><div class="row"><label>数量</label><div class="seg" id="cnt"></div></div><div class="row"><label>预览</label><div class="seg" id="out"></div></div><div class="row"><label>擦边</label><div class="seg" id="near"></div></div><div class="row"><button id="go">开箱</button><button id="mute">🔊</button></div></div>
</div>
<script>
window.UI = { mute: false };
/* ================= FX ENGINE: particles · flash · shake · stamp · sound · micro-interactions ================= */
const RM_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX = (() => {
  let cv, ctx, parts = [], raf = 0;

  }
  function pos(el) { const r = host().getBoundingClientRect(); if (!el) return { x: r.width / 2, y: r.height / 2 }; const e = el.getBoundingClientRect(); return { x: e.left - r.left + e.width / 2, y: e.top - r.top + e.height / 2 }; }

    const r = ensure(); ctx.clearRect(0, 0, r.width, r.height);
    parts = parts.filter(p => p.life < p.max && p.y < r.height + 60);
    for (const p of parts) {
      p.life++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx + (p.sway ? Math.sin((p.life + p.ph) / 14) * p.sway : 0); p.y += p.vy; p.rot += p.vr;
      const a = Math.min(1, (p.max - p.life) / 25); ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.e) { ctx.font = `${p.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.e, 0, 0); }
      else if (p.k === 'spark') { ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.s); g.addColorStop(0, p.c); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.s, 0, 7); ctx.fill(); }
      else { ctx.fillStyle = p.c; ctx.scale(1, Math.cos(p.life / 6 + p.ph)); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }

  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  const pick = a => a[Math.random() * a.length | 0];
  function burst(x, y, o = {}) {
    if (RM_MOTION) return; ensure();
    const n = o.n || 80, pw = o.power || 9, cols = o.colors || ['#ffd54a', '#ff3b30', '#3898ff', '#fff'], em = o.emojis || [], er = em.length ? (o.emojiRatio ?? .3) : 0;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = pw * (.35 + Math.random() * .9), isE = Math.random() < er, spark = !isE && Math.random() < .25;
      parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - pw * .35, g: o.gravity ?? .22, drag: .975, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 0, max: 70 + Math.random() * 60, s: isE ? 16 + Math.random() * 14 : spark ? 8 + Math.random() * 10 : 6 + Math.random() * 7, c: pick(cols), e: isE ? pick(em) : null, k: spark ? 'spark' : 'conf', ph: Math.random() * 9 });
    }
    kick();
  }
  function rain(o = {}) {
    if (RM_MOTION) return; const r = ensure(), n = o.n || 70, dur = o.dur || 2200, em = o.emojis || [], cols = o.colors || ['#fff'];
    for (let i = 0; i < n; i++) setTimeout(() => { parts.push({ x: Math.random() * r.width, y: -30, vx: (Math.random() - .5) * 1.2, vy: 1.5 + Math.random() * 2.5, g: .03, drag: .995, rot: Math.random() * 6, vr: (Math.random() - .5) * .08, life: 0, max: 400, s: em.length && Math.random() < .7 ? 18 + Math.random() * 14 : 8 + Math.random() * 6, c: pick(cols), e: em.length && Math.random() < .7 ? pick(em) : null, k: 'conf', sway: 1.2, ph: Math.random() * 99 }); kick(); }, Math.random() * dur);
  }

  function celebrate(tier, el, o = {}) {
    const p = pos(el), em = o.emojis || ['✨', '🪙', '💎'], cols = o.colors || ['#ffd54a', '#ff3b30', '#3898ff', '#ffffff', '#b061ff'];
    if (tier === 'sp') { flash('#fff', 520); shake(document.querySelector('#userModal .fx-target') || document.getElementById('userModal')); burst(p.x, p.y, { n: 190, power: 14, colors: cols, emojis: em, emojiRatio: .35 }); setTimeout(() => burst(p.x, p.y, { n: 90, power: 9, colors: cols }), 280); setTimeout(() => rain({ n: 90, emojis: em, colors: cols, dur: 2600 }), 350); stamp(o.stamp || 'SP!!', '#ff3b30', o.sub || 'SUPER PRIZE'); SFX.win('sp'); return 2300; }
    if (tier === 'a') { flash('#ffd54a66', 380); burst(p.x, p.y, { n: 100, power: 10, colors: ['#ffd54a', '#fff1a8', '#ffb000', '#ffffff'], emojis: em.slice(0, 2), emojiRatio: .15 }); stamp(o.stampA || 'GREAT!', '#f5b301'); SFX.win('a'); return 1500; }

    burst(p.x, p.y, { n: 26, power: 5, colors: ['#ffffff', '#9fd0ff', tier === 'c' ? '#3b9bff' : '#9aa6bb'] }); SFX.win(tier); return 800;
  }
  return { burst, rain, flash, shake, stamp, celebrate, pos };
})();
const SFX = (() => {
  let ac, last = 0; const on = () => !(window.UI && UI.mute);
  const A = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());

  function noise(dur, vol = .15, hp = 800) { const a = A(), b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start(); }

    tick: safe((p = 1) => { const n = performance.now(); if (n - last < 38) return; last = n; tone(1100 * p, 0, .035, 'square', .035); }),
    click: safe(() => tone(700, 0, .05, 'triangle', .05)),
    whoosh: safe(() => { noise(.35, .08, 1200); tone(220, 0, .35, 'sine', .05, 880); }),
    charge: safe(() => { tone(110, 0, 1.1, 'sawtooth', .04, 660); tone(220, .05, 1.05, 'sine', .05, 1320); }),
    thump: safe(() => { tone(70, 0, .18, 'sine', .35, 45); tone(70, .2, .16, 'sine', .25, 45); }),
    pop: safe(() => { noise(.12, .18, 2000); tone(520, 0, .14, 'triangle', .14, 160); }),
    win: safe(t => { const seq = { sp: [523, 659, 784, 1047, 1319, 1568], a: [523, 659, 784, 1047], b: [587, 784, 988], c: [659, 880], d: [523, 659] }[t] || [523]; seq.forEach((f, i) => tone(f, i * .085, .4, 'triangle', .1)); if (t === 'sp') { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .62 + i * .11, .7, 'sawtooth', .035)); noise(.6, .05, 3000); } })
  };
})();
/* ---------- global micro-interactions ---------- */
(() => {
  // ripple on buttons
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('#userPane button, #userPane .p-card, #userPane .p-qt'); if (!b || RM_MOTION) return;
    const r = b.getBoundingClientRect(), s = document.createElement('span'), d = Math.max(r.width, r.height) * 2;
    s.className = 'fx-rip'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;

  }, true);
  // 3D tilt on box cards (pointer devices only)
