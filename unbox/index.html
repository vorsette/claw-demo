<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Unbox Lab · 5 种开盒动画</title>
<link rel="preconnect" href="https://images.unsplash.com">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#f4f2fb;color:#1f1b3a;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#mode{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,220px));justify-content:center;gap:5px;padding:8px 8px 0;background:#fff}
#mode button{min-width:0;padding:9px 2px;border-radius:10px;background:#f4f2fb;border:1px solid #e7e3f5;font-size:13px;font-weight:800;white-space:nowrap;color:#6b6690}#mode button.on{background:#6c4dff;border-color:#6c4dff;color:#fff}

.row{display:flex;gap:6px;align-items:center;width:min(100%,620px);margin:0 auto}.row>label{font-size:11px;color:#8d88ad;width:34px;flex:none}.seg{display:flex;gap:5px;flex:1;min-width:0}.seg button{flex:1}

.fx-cv{position:absolute;inset:0;z-index:85;pointer-events:none}.fx-flash,.fx-stamp{display:none}

#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:radial-gradient(60% 40% at 18% 12%,#e3dcff,transparent 70%),radial-gradient(55% 40% at 88% 86%,#d7f3ff,transparent 70%),linear-gradient(#faf9ff,#f1eff9)}

.grid{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--g);width:calc(var(--cols)*var(--s) + (var(--cols) - 1)*var(--g));max-width:100%}

.sw{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}.sw i.hero{box-shadow:0 0 0 3px #ff5a3c,0 0 26px #ff5a3caa,0 10px 24px #2a1f5c44}.sw i.hero:after{content:'SP';position:absolute;left:-6%;top:-6%;padding:0 .5em;border-radius:1em;background:#ff5a3c;color:#fff;font-size:11px;font-weight:800;line-height:1.6;box-shadow:0 0 0 2px #fff}
.sw i{position:absolute;left:0;top:0;width:var(--z);height:var(--z);border-radius:22%;background:#fff center/cover no-repeat;box-shadow:0 0 0 2px #fff,0 8px 20px #2a1f5c33;display:grid;place-items:center;font-style:normal;font-size:calc(var(--z)*.5);will-change:transform,opacity;opacity:0}
#play .grid{position:relative;z-index:1}
/* mode C: one fixed photo behind the package keeps changing, slows down, pauses on a top prize, then settles on the real one */
.stk{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:100%}
.bk{position:relative;z-index:0;flex:none;width:var(--z);height:var(--z);margin-bottom:calc(var(--z)*-.36);border-radius:18%;background:#fff;--tc:#dcd7ef;box-shadow:0 0 0 3px var(--tc),0 0 0 9px color-mix(in srgb,var(--tc) 22%,transparent),0 18px 40px color-mix(in srgb,var(--tc) 35%,transparent);transition:opacity .35s,transform .35s}
.bk:empty{opacity:0}.bk-p{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:grid;place-items:center;font-size:calc(var(--z)*.4)}.bk-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bk b{position:absolute;left:6%;top:6%;padding:.05em .6em;border-radius:1em;background:var(--tc);color:#fff;font-size:13px;font-weight:800;line-height:1.6}
.bk.pop{animation:bkp .16s ease-out}@keyframes bkp{from{transform:scale(.94);filter:brightness(1.35)}}
.bk.hot{animation:bkh .26s ease-in-out infinite alternate}@keyframes bkh{to{transform:scale(1.05);box-shadow:0 0 0 4px var(--tc),0 0 0 14px color-mix(in srgb,var(--tc) 30%,transparent),0 0 60px var(--tc)}}
.bk.out{opacity:0;transform:scale(.8)}

#hud{flex:none;min-height:46px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;font-size:13px;font-weight:700;color:#6b6690;padding:0 12px 10px;text-align:center}#hud b{color:#1f1b3a}
#hud button{padding:9px 16px;border-radius:20px;background:#6c4dff;color:#fff;font-weight:800;font-size:13px}#hud button.ghost{background:#fff;border:1px solid #dcd7ef;color:#6b6690}
.board .u{height:var(--s);cursor:pointer;-webkit-user-select:none;user-select:none;transition:opacity .4s,transform .4s}.board .u-pz{left:5%;top:5%;width:90%}.board .cd-b,.board .pd-veil{left:5%;top:5%;width:90%}
.board .u:not(.open):not(.pre) .u-w{animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-190ms)}@keyframes bob{50%{transform:translateY(-4%)}}

.board .u.other{opacity:.45;transform:scale(.88)}.board .u.other.hi{opacity:1;transform:none}.board .u.other.hi .tl-b{box-shadow:0 0 0 2px var(--tc),0 0 0 6px color-mix(in srgb,var(--tc) 28%,transparent)}

.tl{position:relative;width:100%;height:100%}
.tl-b{position:relative;width:100%;height:100%;border-radius:16%;background:#fff;border:1px solid #e4e0f3;overflow:hidden;display:grid;place-items:center;font-size:calc(var(--s)*.34);transition:box-shadow .4s}
.tl-b img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl-t{position:absolute;left:7%;top:7%;z-index:1;padding:.08em .5em;border-radius:1em;background:var(--tc);color:#fff;font-size:clamp(8px,calc(var(--s)*.085),15px);font-weight:800;line-height:1.5;opacity:0;transform:scale(.4);transition:.35s cubic-bezier(.2,1.6,.4,1)}
.u.done .tl-t,.pay .tl-t{opacity:1;transform:none}.u.done .tl-b{box-shadow:0 0 0 3px var(--tc),0 12px 30px color-mix(in srgb,var(--tc) 40%,transparent)}

.u.open .u-pz{transform:none;opacity:1}
.u-w{position:absolute;inset:0;z-index:2;pointer-events:none}.u-w i{position:absolute;display:block;font-style:normal}.u-w b{position:relative;color:#fff;font-weight:900;font-size:calc(var(--s)*.26);text-shadow:0 2px 0 #0002}

.u.open .u-gl{animation:glow calc(.8s*var(--k)) ease-out}@keyframes glow{0%{transform:translate(-50%,-50%) scale(0);opacity:.95}100%{transform:translate(-50%,-50%) scale(13);opacity:0}}
.u:not(.big) .u-nm{display:none}.u-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;position:absolute;left:-10%;right:-10%;top:100%;text-align:center;font-size:13px;font-weight:700;line-height:1.3;opacity:0;transform:translateY(8px);transition:.35s}.u-nm em{display:block;font-style:normal;font-weight:800;font-size:17px;color:var(--tc)}.u.big.done .u-nm{opacity:1;transform:none}

.bx-lid{left:3%;right:3%;top:22%;height:19%;border-radius:8%/36%;background:linear-gradient(160deg,var(--c3),var(--c1));box-shadow:0 6px 12px #3a2b8a33;transition:transform calc(.55s*var(--k)) cubic-bezier(.3,1.4,.5,1),opacity .35s calc(.25s*var(--k))}
.bx-lid:after{content:'';position:absolute;left:50%;top:-58%;width:44%;height:70%;margin-left:-22%;background:radial-gradient(ellipse at 26% 55%,#fff 0 40%,transparent 42%),radial-gradient(ellipse at 74% 55%,#fff 0 40%,transparent 42%)}
.t0.pre .u-w{animation:wig .4s ease-in-out infinite}.t0.open .bx-lid{transform:translate(-34%,-150%) rotate(-30deg);opacity:0}.t0.open .bx-body{transform:translateY(70%) scale(.92);opacity:0}

.t1{--c1:#35c9c0;--c2:#1b8fa8;--c3:#8ff0e4}

.bg-top{left:12%;right:12%;top:7%;height:15%;background:linear-gradient(105deg,var(--c2),var(--c1));clip-path:polygon(0 100%,0 18%,6% 0,12% 18%,18% 0,24% 18%,30% 0,36% 18%,42% 0,48% 18%,54% 0,60% 18%,66% 0,72% 18%,78% 0,84% 18%,90% 0,96% 18%,100% 0,100% 100%);transform-origin:0 100%;transition:transform calc(.5s*var(--k)) cubic-bezier(.3,1.3,.5,1),opacity .3s calc(.25s*var(--k))}
.bg-tear{left:12%;top:21%;height:3px;width:0;background:#fff;box-shadow:0 0 8px #fff,0 0 2px var(--c2);border-radius:2px}.t1.pre .bg-tear{width:76%;transition:width var(--pt) linear}.t1.open .bg-tear{opacity:0}
.t1.open .bg-top{transform:translate(18%,-130%) rotate(26deg);opacity:0}.t1.open .bg-body{transform:translateY(75%);opacity:0}
/* ③ capsule */
.t2{--c1:#ff8fb0;--c2:#ff5c8a}
.cp-t,.cp-b{left:9%;right:9%;height:41%;transition:transform calc(.6s*var(--k)) cubic-bezier(.3,1.3,.5,1),opacity .35s calc(.28s*var(--k))}
.cp-t{top:9%;border-radius:50% 50% 0 0/100% 100% 0 0;background:radial-gradient(circle at 30% 34%,#ffffffd9 0 9%,transparent 22%),linear-gradient(160deg,color-mix(in srgb,var(--c1) 82%,#fff),var(--c2));box-shadow:inset 0 -6px 0 #0000001a}
.cp-b{top:50%;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#fff,#ebe7f6);box-shadow:inset 0 6px 0 #0000000f,0 14px 24px #8a2b5033;display:grid!important;place-items:center}.cp-b b{color:var(--c2);text-shadow:none;font-size:calc(var(--s)*.2)}
.t2.pre .u-w{animation:roll .5s ease-in-out infinite}@keyframes roll{25%{transform:rotate(-11deg) translateX(-5%)}75%{transform:rotate(11deg) translateX(5%)}}
.t2.open .cp-t{transform:translate(-38%,-115%) rotate(-42deg);opacity:0}.t2.open .cp-b{transform:translate(32%,110%) rotate(32deg);opacity:0}
/* ④ card flip */
.t3{--c1:#3a3f8f;--c2:#1f2260}
.t3 .u-pz{transform:rotateY(-180deg);opacity:1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform calc(.7s*var(--k)) cubic-bezier(.3,1.2,.5,1)}.t3.open .u-pz{transform:none}
.cd-b{left:7%;top:6%;width:86%;aspect-ratio:1;border-radius:16%;background:repeating-linear-gradient(135deg,#ffffff14 0 7px,transparent 7px 14px),linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 14px 26px #1f226044,inset 0 0 0 3px #ffffff2e;display:grid!important;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform calc(.7s*var(--k)) cubic-bezier(.3,1.2,.5,1)}
.t3.pre .u-in{transform:translateY(-5%) scale(1.05);transition:transform .3s}.t3.open .cd-b{transform:rotateY(180deg)}
.t3 .tl-b:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,transparent 36%,#ffffffb3 50%,transparent 64%);background-size:260% 100%;background-position:140% 0;pointer-events:none}.t3.done .tl-b:before{animation:shine .9s ease-out}@keyframes shine{to{background-position:-60% 0}}
/* ⑤ display reveal */
.t4 .u-pz{transform:none;opacity:1;transition:none}
.pd-veil{left:7%;top:6%;width:86%;aspect-ratio:1;border-radius:16%;background:linear-gradient(150deg,#2b2f4a,#14162a);display:grid!important;place-items:center;clip-path:inset(0 0 0 0 round 16%);transition:clip-path calc(.9s*var(--k)) cubic-bezier(.6,0,.3,1)}.pd-veil b{color:#ffffff66}

.pd-base{left:14%;right:14%;top:93%;height:6%;border-radius:50%;background:radial-gradient(ellipse,#1f1b3a33,transparent 70%)}
.t4.pre .pd-veil{animation:pulse .7s ease-in-out infinite alternate}@keyframes pulse{to{filter:brightness(1.5)}}
.t4.open .pd-veil{clip-path:inset(100% 0 0 0 round 16%)}.t4.open .pd-scan{animation:scan calc(.9s*var(--k)) cubic-bezier(.6,0,.3,1) both}@keyframes scan{0%{opacity:1;top:6%}90%{opacity:1}100%{opacity:0;top:calc(6% + var(--s)*.86)}}
/* result */
.pay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;background:#faf9fff5;animation:fade .25s}@keyframes fade{from{opacity:0}}
.pay h2{font-size:clamp(22px,7cqi,34px);font-weight:800;letter-spacing:1px;animation:payin .5s cubic-bezier(.2,1.4,.4,1)}@keyframes payin{from{transform:scale(.5);opacity:0}}
.pay p{font-size:14px;font-weight:700;color:#6b6690}.pay p b{color:#1f1b3a;font-size:19px}
.pay-g{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px;--s:var(--pw)}.pay-g figure{width:var(--pw);display:flex;flex-direction:column;align-items:center;gap:6px;animation:payin .45s cubic-bezier(.2,1.4,.4,1) both}.pay-g .tl{width:var(--pw);height:var(--pw)}.pay-g .tl-b{box-shadow:0 0 0 2.5px var(--tc),0 8px 20px color-mix(in srgb,var(--tc) 30%,transparent)}

<div id="userPane">
 <div id="mode"></div>
 <div id="bar"></div>
 <div id="userModal"><div id="stage" class="fx-target"><div id="ttl"></div><div id="play"></div><div id="hud"></div><button id="skip">跳过</button></div></div>
 <div id="ctl"><div class="row"><label>数量</label><div class="seg" id="cnt"></div></div><div class="row"><label>预览</label><div class="seg" id="out"></div></div><div class="row" id="flyrow"><label>飞行</label><div class="seg" id="fly"></div></div><div class="row"><button id="go">开盒</button><button id="mute">🔊</button></div></div>
</div>
<script>
window.UI = { mute: false };
/* ================= FX ENGINE: particles · flash · shake · stamp · sound · micro-interactions ================= */
const RM_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX = (() => {
  let cv, ctx, parts = [], raf = 0;
  const host = () => document.getElementById('userPane');
  function ensure() {
    const h = host(); if (!cv || !h.contains(cv)) { cv = document.createElement('canvas'); cv.className = 'fx-cv'; h.appendChild(cv); ctx = cv.getContext('2d'); }
    const r = h.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    if (cv.width !== Math.round(r.width * d) || cv.height !== Math.round(r.height * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); }
    return r;
  }
  function pos(el) { const r = host().getBoundingClientRect(); if (!el) return { x: r.width / 2, y: r.height / 2 }; const e = el.getBoundingClientRect(); return { x: e.left - r.left + e.width / 2, y: e.top - r.top + e.height / 2 }; }
  function loop() {
    const r = ensure(); ctx.clearRect(0, 0, r.width, r.height);
    parts = parts.filter(p => p.life < p.max && p.y < r.height + 60);
    for (const p of parts) {
      p.life++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx + (p.sway ? Math.sin((p.life + p.ph) / 14) * p.sway : 0); p.y += p.vy; p.rot += p.vr;
      const a = Math.min(1, (p.max - p.life) / 25); ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.e) { ctx.font = `${p.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.e, 0, 0); }
      else if (p.k === 'spark') { ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.s); g.addColorStop(0, p.c); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.s, 0, 7); ctx.fill(); }
      else { ctx.fillStyle = p.c; ctx.scale(1, Math.cos(p.life / 6 + p.ph)); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0; if (!raf) ctx.clearRect(0, 0, r.width, r.height);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  const pick = a => a[Math.random() * a.length | 0];
  function burst(x, y, o = {}) {
    if (RM_MOTION) return; ensure();
    const n = o.n || 80, pw = o.power || 9, cols = o.colors || ['#ffd54a', '#ff3b30', '#3898ff', '#fff'], em = o.emojis || [], er = em.length ? (o.emojiRatio ?? .3) : 0;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = pw * (.35 + Math.random() * .9), isE = Math.random() < er, spark = !isE && Math.random() < .25;
      parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - pw * .35, g: o.gravity ?? .22, drag: .975, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 0, max: 70 + Math.random() * 60, s: isE ? 16 + Math.random() * 14 : spark ? 8 + Math.random() * 10 : 6 + Math.random() * 7, c: pick(cols), e: isE ? pick(em) : null, k: spark ? 'spark' : 'conf', ph: Math.random() * 9 });
    }
    kick();
