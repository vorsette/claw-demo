<title>Kapsul · Mystery Box Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Sans+KR:wght@500;700;800&family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif);background:var(--shell-bg);color:var(--shell-txt);overflow:hidden}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
#topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--shell-bar);border-bottom:1px solid var(--shell-line);position:relative;z-index:50}
.tb-brand{font-size:13px;color:var(--shell-mut);white-space:nowrap}.tb-brand b{color:var(--shell-txt)}
.tb-tabs{display:flex;gap:4px;background:var(--shell-tabbg);padding:4px;border-radius:10px;margin:0 auto}
.tb-tabs button{border:0;background:transparent;color:var(--shell-mut);padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600}
.tb-tabs button.on{background:var(--shell-tabon);color:var(--shell-tabtxt);box-shadow:0 1px 3px #0003}
.tb-right{display:flex;gap:8px;align-items:center}.tb-right button{border:1px solid var(--shell-line);background:transparent;color:var(--shell-mut);padding:6px 10px;border-radius:7px;font-size:12px}
#stage{display:flex;flex:1 1 auto;min-height:0}
.pane{position:relative;flex:1;min-width:0;height:100%;overflow:hidden}
.pane>.scroll{position:absolute;inset:0;overflow:auto;scroll-behavior:auto}
#userPane{container-type:inline-size;container-name:up}
.view-user #adminPane,.view-admin #userPane{display:none}
.view-split #userPane{flex:0 0 46%;border-right:3px solid var(--shell-line)}
.mlayer{position:absolute;inset:0;display:none;z-index:40;align-items:center;justify-content:center;padding:16px}
.mlayer.show{display:flex}.mbg{position:absolute;inset:0;background:#000a;backdrop-filter:blur(3px)}
.mlayer>*:not(.mbg){position:relative}
.toasts{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.tst{background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px #0005;transition:.35s;max-width:90vw}
.tst.err{background:#c0262d}.tst.ok{background:#0f9d58}.tst.out{opacity:0;transform:translateY(-8px)}

/* ===== ADMIN (themed by --a-* vars) ===== */
#adminPane{background:var(--a-bg);color:var(--a-txt);font-size:13px}
.ad{display:flex;min-height:100%}
.ad-side{width:190px;flex:0 0 190px;background:var(--a-side);border-right:1px solid var(--a-line);position:sticky;top:0;align-self:flex-start;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.ad-logo{font-weight:800;font-size:16px;padding:4px 10px 14px}.ad-logo small{font-weight:500;color:var(--a-mut);font-size:11px;margin-left:4px}
.ad-nav{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--a-mut);padding:9px 10px;border-radius:8px;text-align:left;font-size:13px}
.ad-nav:hover{background:var(--a-hover)}.ad-nav.on{background:var(--a-acc-soft);color:var(--a-acc);font-weight:700}
.ad-nav em{margin-left:auto;background:#f43f5e;color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:1px 7px}
.ad-sim{margin-top:auto;font-size:11px;color:var(--a-mut);display:flex;gap:7px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px dashed var(--a-line)}
.ad-sim i{width:8px;height:8px;border-radius:50%;background:#999}.ad-sim.on i{background:#22c55e;box-shadow:0 0 0 3px #22c55e33;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #22c55e00}}
.ad-main{flex:1;min-width:0;padding:18px 20px 40px}
.ad-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}.ad-h h2{margin:0;font-size:19px}
.muted{color:var(--a-mut);font-weight:400;font-size:12px}
.seg{display:flex;background:var(--a-card);border:1px solid var(--a-line);border-radius:8px;padding:3px}.seg button{border:0;background:transparent;color:var(--a-mut);padding:5px 12px;border-radius:6px}.seg button.on{background:var(--a-acc);color:var(--a-acc-txt)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--a-card);border:1px solid var(--a-line);border-radius:12px;padding:12px 14px}
.kl{font-size:12px;color:var(--a-mut)}.kv{font-size:21px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}.ks{font-size:11px;color:var(--a-mut);margin-top:3px}
.kpi.pos .kv,.pos{color:#16a34a}.kpi.neg .kv,.neg{color:#e11d48}.kpi.warn .kv,.warnt{color:#d97706}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.card-h{font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px}.grid2>.card{margin-bottom:0}
.grid2+.note,.grid2+.card{margin-top:14px}
.tw{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--a-mut);font-weight:600;padding:8px;border-bottom:1px solid var(--a-line);white-space:nowrap;position:sticky;top:0;background:var(--a-card)}
td{padding:8px;border-bottom:1px solid var(--a-line2);vertical-align:middle;white-space:nowrap}td.addr{white-space:normal;min-width:180px}td.wrapc{white-space:normal;min-width:220px;max-width:420px}td.wrapc .pill{margin:2px 0}.lgtab td{white-space:normal}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}tr.off{opacity:.45}.nowrap{white-space:nowrap}.empty{text-align:center;color:var(--a-mut);padding:22px}
td.addr{max-width:220px;font-size:11.5px;color:var(--a-mut)}
.tg{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,transparent);border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.gray{background:#8882;color:var(--a-mut)}.pill.green{background:#16a34a22;color:#16a34a}.pill.amber{background:#f59e0b22;color:#d97706}.pill.blue{background:#3b82f622;color:#3b82f6}.pill.red{background:#e11d4822;color:#e11d48}.pill.pink{background:#ec489922;color:#db2777}
small.bot{font-size:9px;background:#8883;color:var(--a-mut);padding:1px 4px;border-radius:3px}
.bxe{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid;font-size:19px}
.btn{border:1px solid var(--a-line);background:var(--a-card);color:var(--a-txt);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn.sm{padding:4px 10px;font-size:12px}.btn.pri{background:var(--a-acc);border-color:var(--a-acc);color:var(--a-acc-txt)}.btn.ghost{background:transparent}.btn:hover{filter:brightness(1.08)}
.sw{position:relative;display:inline-block;width:34px;height:19px}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;background:#8885;border-radius:20px;transition:.2s;cursor:pointer}.sw i:after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--a-acc)}.sw input:checked+i:after{left:17px}
.tog{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer}.tog input{display:none}.tog i{flex:0 0 34px;height:19px;background:#8885;border-radius:20px;position:relative;transition:.2s;margin-top:1px}.tog i:after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.2s}.tog input:checked+i{background:var(--a-acc)}.tog input:checked+i:after{left:17px}
.tog span{display:flex;flex-direction:column}.tog small{color:var(--a-mut);font-size:11px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.fld span{font-size:12px;color:var(--a-mut)}.fld small{font-size:11px;color:var(--a-mut)}
#adminPane input:not([type=checkbox]),#adminPane select{background:var(--a-input);border:1px solid var(--a-line);color:var(--a-txt);border-radius:7px;padding:7px 9px;outline:none;min-width:0}
#adminPane input:focus,#adminPane select:focus{border-color:var(--a-acc)}#adminPane input[type=color]{padding:2px;height:34px}
.srch{width:180px}.row{display:flex;align-items:center;flex-wrap:wrap}.gap{gap:10px}
.note{font-size:12px;color:var(--a-mut);background:var(--a-card);border:1px dashed var(--a-line);border-radius:10px;padding:10px 12px;line-height:1.6}
.warnbox{background:#f59e0b18;border:1px solid #f59e0b55;color:#b45309;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.bar i{width:100%;background:linear-gradient(to top,var(--a-acc),var(--a-acc2));border-radius:4px 4px 1px 1px;min-height:2px}.bar span{font-size:10px;color:var(--a-mut);height:14px;margin-top:4px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.4s infinite}
.ad-modal{background:var(--a-card);color:var(--a-txt);border-radius:14px;width:min(920px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #0007;border:1px solid var(--a-line)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h3{margin:0}.x{border:0;background:transparent;color:var(--a-mut);font-size:18px;width:36px;height:36px;border-radius:8px}.x:hover{background:var(--a-hover)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--a-line)}
table.ed input,table.ed select{width:100%}table.ed input.emo{width:44px;text-align:center}table.ed td{padding:4px}
.edsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.tune{font-size:12px;color:var(--a-mut);display:flex;gap:6px;align-items:center;margin-left:auto}

@media (max-width:760px){.tb-brand{display:none}.tb-tabs{margin:0}.tb-tabs button{padding:7px 9px;white-space:nowrap;font-size:12px}.tb-right button{padding:6px 7px}#topbar{gap:6px;padding:0 8px}.view-split #userPane{flex-basis:50%}}
.tb-tabs button{white-space:nowrap}
table.ed{min-width:1040px}table.ed select{min-width:84px}table.ed input[type=number]{width:96px}table.ed td:nth-child(2) input{min-width:160px}

#adminPane{container-type:inline-size;container-name:ap}
.ad-main>*{animation:adIn .35s both}@keyframes adIn{from{opacity:0;transform:translateY(8px)}}
.kpi{transition:transform .2s,box-shadow .2s}.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002}
.ad-modal{animation:adM .3s cubic-bezier(.2,1.3,.4,1)}@keyframes adM{from{transform:scale(.92);opacity:0}}
.bar i{animation:barUp .6s cubic-bezier(.2,1,.3,1) both;transform-origin:bottom}@keyframes barUp{from{transform:scaleY(0)}}
@container ap (max-width:760px){
 .ad{flex-direction:column}.ad-side{width:auto;max-width:100%;align-self:stretch;flex:none;height:auto;position:sticky;top:0;z-index:6;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--a-line);scrollbar-width:none}
 .ad-logo{display:none}.ad-nav{white-space:nowrap;flex:0 0 auto}.ad-sim{margin-top:0;flex:0 0 auto;white-space:nowrap}.ad-main{padding:12px 12px 30px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{font-size:17px}
 .fgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.ad-h h2{font-size:17px}
}

/* split view on narrow screens: stack panes */
@media (max-width:900px){.view-split#stage,#stage.view-split{flex-direction:column}.view-split #userPane{flex:0 0 55%;border-right:0;border-bottom:3px solid var(--shell-line)}.view-split #adminPane{flex:1}}

.bxe{position:relative;overflow:hidden}.bxe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
td.imgc{display:flex;align-items:center;gap:6px;min-width:190px}td.imgc img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:0 0 auto;background:#8882}td.imgc input{flex:1;min-width:0}

/* fit the VISIBLE viewport: on phones 100vh is taller than what is on screen (address bar), which pushed the bottom bar off-screen */
html,body{height:100%}
body{display:flex;flex-direction:column;height:100%;height:100dvh}
#topbar{flex:0 0 52px}
@container ap (min-width:761px){.ad-side{height:calc(100vh - 52px);height:calc(100dvh - 52px)}}

:root{--shell-bg:#060b18;--shell-bar:#04070f;--shell-line:#16213a;--shell-txt:#eaf2ff;--shell-mut:#7d93b5;--shell-tabbg:#0b1426;--shell-tabon:#2f86ff;--shell-tabtxt:#fff;
--a-bg:#070c18;--a-side:#050913;--a-card:#0c1322;--a-line:#1b2740;--a-line2:#141e33;--a-txt:#e6eefc;--a-mut:#7d93b5;--a-hover:#111b30;--a-acc:#3898ff;--a-acc2:#7fc2ff;--a-acc-soft:#3898ff1f;--a-acc-txt:#fff;--a-input:#080e1b;
--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif}
/* ======== design tokens (themes override these on #userPane.th-*) ======== */
#userPane{
 --pg:#060b18;--col:#060607;--hd:#000;--card:#050707;--card2:#0a0a0c;--line:rgba(145,145,145,.2);--line2:rgba(145,145,145,.28);
 --acc:#3898ff;--acc2:#7fc2ff;--accg:linear-gradient(90deg,#4095f1,#0b5cc7);--acct:#fff;--glow:#3898ff;
 --txt:#fff;--txt2:#c2d2ec;--mut:#8aa0c0;--nav:#0a1428;--navl:#16243f;--navt:#3d6188;--navon:#7fc2ff;--gold:#f0b429;
 --spg:linear-gradient(109deg,#ff4e3d 0%,#ff8b3d 45%,#000 100%);--lvg:linear-gradient(105deg,#b03eae 24%,#0d1eb6 210%);
 --mod:linear-gradient(180deg,#0e1d3a,#091223);--modl:rgba(56,152,255,.35);--sheet:#07090e;
 --hero:radial-gradient(circle at 68% 60%,#1b2f66 0,transparent 45%),radial-gradient(circle at 95% 10%,#3b1d5c 0,transparent 40%),linear-gradient(90deg,#05070c 30%,#0a1124);--heroem:#38a0ff;--herot:#fff;--herop:#c2d2ec;
 --itm:#fff3cf;--itb:#0d1a33;--itbt:#fff;--itbsp:linear-gradient(90deg,#3d4a58,#6b7a88);
 --dbtn:linear-gradient(180deg,#4377b5,#1a3157);--dbtnt:#fff;--dbtnl:#ffffff1c;
 --ann:#09162e;--annt:#c2d2ec;--wc:linear-gradient(-1.6deg,#000 68%,#32a6e7 167%);--wcl:rgba(56,152,255,.45);
 --plat:linear-gradient(#6b7a88,#3d4a58);--hdpat:none;--heropat:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);
 --font2:var(--font);--r:8px;--avr:#0d3b66;
 --q2:#ff9f43;--q3:#b48cff;--q4:#2ec4a6;--tlsp:#ff6b5e;--tla:#f5c242;--tlb:#c58bff;--tlc:#3cc4ff;--tld:#5be07a;--pos:#22c55e;--neg:#ff6b5e;--star:#f5b301;--itbspt:#fff;
 --btn2:color-mix(in srgb,var(--acc) 14%,var(--card));--btn2t:var(--acc2);--btn2l:color-mix(in srgb,var(--acc) 40%,transparent);
 background:var(--pg);color:var(--txt);font-family:var(--font)}
#userPane .tst{background:var(--card);color:var(--txt);border:1px solid var(--modl);border-radius:12px;box-shadow:0 10px 30px #0008;animation:tIn .45s cubic-bezier(.2,1.4,.4,1)}#userPane .tst.ok{border-color:#22c55e}#userPane .tst.err{border-color:#ff4e3d}
@keyframes tIn{from{transform:translateY(-16px) scale(.9);opacity:0}}
/* ======== layout ======== */
.P{min-height:100%;display:flex;justify-content:center}
.p-col{position:relative;overflow-x:clip;width:min(500px,100%);min-height:100%;background:var(--col);display:flex;flex-direction:column;border-inline:1px solid #ffffff08}
.p-hd{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--hd);background-image:var(--hdpat);border-bottom:1px solid var(--line)}
.p-hd.boxh{display:none}
.p-logo{padding:6px 4px;position:absolute;left:50%;transform:translateX(-50%);font-family:var(--font2);font-weight:900;font-style:italic;font-size:21px;letter-spacing:-.6px;cursor:pointer;color:var(--txt);white-space:nowrap;transition:transform .2s}.p-logo:hover{transform:translateX(-50%) scale(1.05)}
.p-logo b{background:linear-gradient(180deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.p-tnav{display:none}.desk-only{display:none!important}
.p-hd:has(.p-bal) .p-logo{position:static;transform:none;font-size:19px}.p-hd:has(.p-bal) .p-logo:hover{transform:scale(1.04)}
@container up (max-width:420px){.p-hd:has(.p-bal) .p-hr>.p-ib:first-of-type{display:none}}
.p-hr{margin-left:auto;display:flex;gap:7px;align-items:center}
.p-ib{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);color:var(--txt);display:inline-grid;place-items:center;padding:0;flex:0 0 auto;transition:transform .15s,border-color .2s}.p-ib:hover{border-color:var(--acc)}.p-ib:active{transform:scale(.9)}
.p-ib.sq{border-radius:var(--r)}.p-ib.nb{background:var(--btn2);border-color:var(--btn2l);color:var(--btn2t)}
.p-dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:#ff4e3d;animation:dotp 2s infinite}@keyframes dotp{50%{box-shadow:0 0 0 4px #ff4e3d00}0%{box-shadow:0 0 0 0 #ff4e3d99}}
.p-lang{border:0;cursor:pointer;display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--acc2);font-size:11px;font-weight:700;padding:7px 9px;border-radius:var(--r)}
.p-bal{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--acc) 14%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);color:var(--txt);font-weight:800;font-size:12px;padding:0 0 0 9px;border-radius:var(--r);height:32px;overflow:hidden;font-variant-numeric:tabular-nums}.p-bal b{background:var(--accg);color:var(--acct);height:100%;display:grid;place-items:center;width:26px}
.p-ann{background:var(--ann);color:var(--annt);font-size:11px;text-align:center;padding:6px 10px;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}.p-ann span{display:inline-block;animation:annIn .6s both}.p-ann.warn{background:#3a2a05;color:#ffd27a}@keyframes annIn{from{transform:translateY(100%);opacity:0}}
.p-main{flex:1;padding:12px 12px 16px;min-width:0}.p-main.boxp{padding:0 0 84px}
.p-empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px;font-size:13px}.p-empty.big{font-size:38px}.p-empty h3{font-size:16px;color:var(--txt)}
.p-mut{color:var(--mut);font-size:12px}.c{text-align:center}
/* hero */
.p-hero{position:relative;height:112px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--hero);display:flex;isolation:isolate}
.p-hero:after{content:'';position:absolute;inset:0;background-image:var(--heropat);background-size:22px 22px;pointer-events:none;z-index:-1}

  const ops = st.opens.filter(o => o.at >= since);
  const sold = st.inv.filter(i => i.status === 'sold' && i.soldAt >= since);
  const shipped = st.inv.filter(i => (i.status === 'shipped' || i.status === 'ship_pending') && (i.reqAt || 0) >= since);
  const vault = st.inv.filter(i => i.status === 'vault');
  const txs = st.tx.filter(t => t.at >= since);
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const k = {
    rev: sum(ops, o => o.price), opens: ops.length, paid: ops.filter(o => !o.free).length, free: ops.filter(o => o.free).length,
    prizeVal: sum(ops, o => o.value), prizeCost: sum(ops, o => o.cost),
    sold: sum(sold, i => i.soldFor), soldN: sold.length, shipCost: sum(shipped, i => i.cost), shipN: shipped.length,
    shipFee: -sum(txs.filter(t => t.type === 'ship_fee'), t => t.amt),
    reward: sum(txs.filter(t => ['daily', 'referral'].includes(t.type)), t => t.amt),
    dep: sum(txs.filter(t => t.type === 'topup'), t => t.amt),
    liab: sum(vault, i => sp(i)), vaultN: vault.length, vaultCost: sum(vault, i => i.cost),
    wdPend: sum(st.wd.filter(w => w.status === 'pending'), w => w.amt), wdDone: sum(st.wd.filter(w => w.status === 'approved' && w.at >= since), w => w.amt),
    players: new Set(ops.map(o => o.uid)).size, ops
  };
  k.contrib = k.rev + k.shipFee - k.sold - k.shipCost - k.reward;
  return k;
}

let simTimer;
function startSim() { clearInterval(simTimer); if (!st.settings.sim) return; simTimer = setInterval(simTick, Math.max(1, +st.settings.simSec || 4) * 1000); }
function simTick() {
  const bots = st.users.filter(u => u.bot && !u.banned), act = st.boxes.filter(b => b.active && wsum(b));
  if (!bots.length || !act.length) return;
  const u = bots[Math.random() * bots.length | 0], b = pickW(act, b => 1 / Math.sqrt(b.price + 1));
  if (u.balance < b.price) { const amt = [50, 100, 200, 500, 1000].find(a => a >= b.price) || 1000; u.balance = r2(u.balance + amt); tx(u.id, 'topup', amt, 'FPX top-up'); }
  const res = A.open(u.id, b.id, { silent: true });
  if (res.ok) { const r = Math.random(); if (r < 0.55) A.sell(res.item.id, { silent: true }); else if (r < 0.63) A.ship([res.item.id], u.addr, { silent: true }); }
  emit('bot');
}
