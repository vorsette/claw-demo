<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>夹夹乐 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width game stage. Neon night world lives on canvas; UI sits on top as chunky cream "toy sticker" panels with ink outlines. Single committed theme. */
  --night:#150c2a; --ink:#27143f; --cream:#fff4e0; --paper:#ffe6c2;
  --pink:#ff4f93; --aqua:#27e0cf; --gold:#ffc42e; --violet:#7b4dff;
  --good:#22b56b; --bad:#ff5468; --mute:#8a6f8f;
  --f-display:'Lilita One','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font:500 14px/1.45 var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background-image:radial-gradient(60vmax 40vmax at 12% 8%,rgba(255,79,147,.2),transparent 60%),radial-gradient(50vmax 40vmax at 92% 92%,rgba(39,224,207,.15),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
#app{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#0d0720;isolation:isolate}
@media(min-width:560px){#app{box-shadow:0 0 0 3px var(--ink),0 0 90px rgba(255,79,147,.28)}}
#stage{position:absolute;inset:0}
canvas{display:block}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* ---------- shared pieces ---------- */
.btn{font:700 15px/1 var(--f-body);color:var(--ink);background:var(--gold);border:2.5px solid var(--ink);border-radius:14px;padding:13px 16px;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.aqua{background:var(--aqua)}.btn.ghost{background:var(--cream)}.btn.violet{background:var(--violet);color:#fff}
.btn.big{font-size:17px;padding:16px 18px;width:100%;border-radius:16px}
.btn.sm{font-size:13px;padding:9px 12px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{filter:grayscale(.8) brightness(.75);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:5px 6px 5px 8px;box-shadow:0 3px 0 var(--ink);font:400 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill em{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:17px;line-height:1}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#d48a00);border:2px solid var(--ink);display:inline-block;flex:none}
.tier{display:inline-block;font:700 11px/1 var(--f-body);padding:3px 7px;border-radius:999px;color:#fff;background:var(--tc);border:1.5px solid var(--ink)}
.t-N{--tc:#7f90a8}.t-R{--tc:#2f8fff}.t-SR{--tc:#a45cff}.t-SSR{--tc:#ff8a00}.t-UR{--tc:#ff2d62}
.ico{position:relative;display:grid;place-items:center;width:58px;height:58px;flex:none;border-radius:14px;border:2.5px solid var(--ink);background:radial-gradient(circle at 50% 35%,#fff,color-mix(in srgb,var(--tc) 38%,#fff))}
.ico img{width:88%;height:88%;object-fit:contain;pointer-events:none}
.ico.lg{width:120px;height:120px;border-radius:24px}
.t-UR.ico{background:conic-gradient(from 0deg,#ffd1dc,#fff3b0,#c8fff4,#d9ccff,#ffd1dc)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.hud-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;background:rgba(21,12,42,.72);border:2px solid var(--ink);border-radius:999px;padding:3px 14px 3px 3px;backdrop-filter:blur(6px)}
.who canvas{width:36px;height:36px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.who span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.who b{font:400 15px/1.1 var(--f-display);color:var(--cream);max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who i{font:700 10px/1.2 var(--f-body);font-style:normal;color:var(--gold)}
.ticker{position:absolute;top:58px;left:10px;right:66px;height:26px;overflow:hidden;border-radius:999px;background:rgba(21,12,42,.6);border:1.5px solid rgba(255,244,224,.16);font-size:12px}
.ticker span{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker span.in{animation:tin .4s both}.ticker b{color:var(--gold);font-weight:700}.ticker u{text-decoration:none;font-weight:700}
@keyframes tin{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.side{position:absolute;top:58px;right:10px;display:flex;flex-direction:column;gap:8px}
.side button{width:48px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);position:relative}
.side button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.side svg{width:22px;height:22px}.side small{font:700 10px/1 var(--f-body)}
.side .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;border:2px solid var(--ink);font:700 10px/14px var(--f-body);text-align:center;padding:0 3px}
.side button.off{background:#cbbfd0}
.hint{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:var(--gold);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;animation:bob 1.4s ease-in-out infinite;transition:opacity .4s}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#pad{position:absolute;inset:auto 0 0 0;height:190px;z-index:6;pointer-events:none}
.joy{width:128px;height:128px;border-radius:50%;background:rgba(255,244,224,.12);border:2.5px solid rgba(255,244,224,.4);pointer-events:auto;touch-action:none;backdrop-filter:blur(3px);position:relative}
#joy{position:absolute;left:18px;bottom:22px}
.joy.off{opacity:.4}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--cream) 60%,#e8cfa4);border:2.5px solid var(--ink);box-shadow:0 4px 0 rgba(39,20,63,.7)}
#act{position:absolute;right:16px;bottom:44px;min-width:104px;height:84px;padding:0 16px;border-radius:26px;background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font:400 19px/1.15 var(--f-display);pointer-events:auto;animation:pulse 1s ease-in-out infinite}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}

/* ---------- claw view ---------- */
#claw{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none}
#claw>*{pointer-events:auto}
#claw .cbar{background:linear-gradient(#0a0516e6,#0a051600)}
#claw .cinfo,#claw .cctl{background:#0a0516cc}
#claw .cinfo{background:linear-gradient(#0a051600,#0a0516cc)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px;flex:none}
.ibtn{width:42px;height:42px;border-radius:13px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.ibtn svg{width:22px;height:22px}
.ctitle{flex:1;min-width:0;line-height:1.15}
.ctitle b{display:block;font:400 20px/1.1 var(--f-display)}
.ctitle span{font-size:12px;color:var(--gold);font-weight:700}
#claw .cstage{flex:1;min-height:0;pointer-events:none}
.cinfo{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 0}
.cmsg{flex:1;min-width:0;background:rgba(255,244,224,.1);border:1.5px solid rgba(255,244,224,.25);color:var(--cream);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.cmsg.pop{animation:mpop .35s}
@keyframes mpop{from{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}}
.cctl{flex:none;display:grid;grid-template-columns:112px 1fr 62px;gap:12px;padding:8px 14px 16px;align-items:center}
#cJoy{width:112px;height:112px}
#cJoy i{width:50px;height:50px;margin:-25px}
.vbtn{height:72px;border-radius:18px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.vbtn svg{width:26px;height:26px}.vbtn small{font:700 11px/1 var(--f-body)}
.vbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.arrow{height:72px;border-radius:20px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;touch-action:none}
.arrow svg{width:30px;height:30px}
.arrow:active,.arrow.on{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);background:var(--aqua)}
.arrow:disabled{filter:grayscale(1) brightness(.6);pointer-events:none}
.go{height:78px;border-radius:24px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:0 7px 0 var(--ink);font:400 24px/1.05 var(--f-display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.go small{font:700 12px/1 var(--f-body);opacity:.75}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.go.grab{background:var(--pink);color:#fff;animation:pulse .7s ease-in-out infinite}
.go:disabled{filter:grayscale(.9) brightness(.6);pointer-events:none;animation:none}

/* ---------- creator ---------- */
#creator{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;pointer-events:none;background:linear-gradient(#0a0516cc 0,#0a051600 22%)}
#creator>*{pointer-events:auto}
#creator .logo{pointer-events:none}
.logo{flex:none;text-align:center;padding:16px 16px 0}
.logo h1{margin:0;font:400 38px/1 var(--f-display);color:#ffe3f0;text-shadow:0 0 18px var(--pink),0 0 2px #fff,0 4px 0 var(--ink);letter-spacing:.06em}
.logo p{margin:6px 0 0;font:700 11px/1 var(--f-body);letter-spacing:.42em;color:var(--aqua);text-shadow:0 0 10px var(--aqua)}
#creator .cform{margin-top:auto}
@media(max-height:540px){.cform{max-height:60%;overflow-y:auto}}
.cform .row{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px}
.cform{flex:none;min-height:0;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 16px 6px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;flex-direction:column;gap:6px}
.row>label,.row>span.l{font:700 12px/1 var(--f-body);color:var(--mute);letter-spacing:.08em}
.nm{display:flex;gap:8px}
.nm input{flex:1;min-width:0;font:700 16px/1 var(--f-body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px}
.sw{display:flex;flex-wrap:wrap;gap:11px;padding:3px 5px 5px}
.sw button{width:31px;height:31px;border-radius:50%;border:2.5px solid var(--ink);background:var(--c);box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.sw button.on{box-shadow:0 0 0 2px var(--cream),0 0 0 5px var(--pink)}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch button{padding:8px 10px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-weight:700;font-size:13px;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.ch button.on{background:var(--pink);color:#fff}
.cfoot{flex:none;background:var(--cream);padding:10px 16px 16px;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}

/* ---------- sheets ---------- */
#modals{position:absolute;inset:0;z-index:30;pointer-events:none}
.modal{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(10,4,24,.62);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet>header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sheet h2{margin:0;font:400 24px/1 var(--f-display)}
.sheet .x{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--cream);font-size:22px;line-height:1}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px}
.note{margin:0;font-size:12px;color:var(--mute);line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{padding:10px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--cream)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px}
.li .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.li .mid b{font-size:14px;line-height:1.2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li .mid small{font-size:11px;color:var(--mute);line-height:1.3}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.price{font:400 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.up{color:var(--bad)}.down{color:var(--good)}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:13px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 2px 7px;color:var(--ink);position:relative;min-width:0}
.cell .ico{width:52px;height:52px;border-width:2px;border-radius:12px}
.cell small{font-size:10.5px;font-weight:700;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cell .eq{position:absolute;top:-6px;right:-4px;background:var(--good);color:#fff;font:700 9px/1 var(--f-body);padding:3px 5px;border-radius:8px;border:1.5px solid var(--ink)}
.bagtop{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:stretch}
.bagtop canvas{width:118px;height:150px;border-radius:16px;border:2.5px solid var(--ink);background:radial-gradient(circle at 50% 30%,#5a1f7e,#1d0f3a)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:2.5px dashed #c9b190;border-radius:14px;font-size:11px;font-weight:700;color:var(--mute);background:#fff8ec;min-height:68px;padding:4px}
.slot.has{border-style:solid;border-color:var(--ink);background:#fff;color:var(--ink)}
.slot img{width:38px;height:38px;object-fit:contain}
.detail{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.detail h3{margin:0;font:400 22px/1.1 var(--f-display)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.kv div{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px}
.kv dt{font-size:11px;color:var(--mute);font-weight:700}.kv dd{margin:2px 0 0;font:400 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
dl{margin:0}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amt{padding:14px 4px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font:400 19px/1 var(--f-display);box-shadow:0 3px 0 var(--ink)}
.amt.on{background:var(--gold);transform:translateY(-2px)}
.field{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px}
.field span{font:400 20px/1 var(--f-display)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 26px/1.2 var(--f-display);color:var(--ink);width:100%}
.sum{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px}
.sw-row small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.tog{width:52px;height:30px;border-radius:15px;background:#cbbfd0;border:2.5px solid var(--ink);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.tog.on{background:var(--good)}.tog.on::after{transform:translateX(22px)}

/* ---------- win ---------- */
#win{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,4,24,.78);overflow:hidden;animation:fade .25s}
.rays{position:absolute;left:50%;top:42%;width:190vmax;height:190vmax;margin:-95vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tc) 55%,transparent) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wbox{position:relative;width:min(88%,360px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:wpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes wpop{from{transform:scale(.3);opacity:0}}
.wtag{font:400 30px/1.1 var(--f-display);color:#fff;text-shadow:0 0 16px var(--tc),0 3px 0 var(--ink);letter-spacing:.04em}
#win.t-UR .wtag,#win.t-SSR .wtag{font-size:40px;background:linear-gradient(90deg,#ffe066,#ff8ad1,#7df2e6,#ffe066);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 var(--ink));animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:200% 0}}
#wCv{width:200px;height:200px}
.wbox h3{margin:0;font:400 26px/1.1 var(--f-display);color:#fff;text-shadow:0 3px 0 var(--ink)}
.wbox .kv{color:var(--ink)}
.wbox .btn.big{margin-top:2px}

/* ---------- fx / overlays ---------- */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#iris{position:absolute;inset:0;z-index:60;pointer-events:none;display:none;background:radial-gradient(circle at 50% 52%,transparent var(--r,0px),#0a0416 calc(var(--r,0px) + 2px))}
#toasts{position:absolute;left:0;right:0;top:92px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);border:2px solid var(--cream);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;max-width:90%;text-align:center;animation:tpop 2.6s both}
.toast.good{background:var(--good);color:#fff;border-color:var(--ink)}.toast.bad{background:var(--bad);color:#fff;border-color:var(--ink)}
@keyframes tpop{0%{transform:translateY(-12px) scale(.8);opacity:0}8%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.flash{position:absolute;inset:0;z-index:45;pointer-events:none;background:#fff;animation:flash .5s both}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.shake{animation:shake .5s}.shake2{animation:shake2 .9s}

@keyframes shake2{5%{transform:translate(-10px,6px) rotate(-.6deg)}20%{transform:translate(10px,-8px) rotate(.6deg)}35%{transform:translate(-9px,-4px)}50%{transform:translate(8px,7px) rotate(-.4deg)}65%{transform:translate(-6px,3px)}80%{transform:translate(4px,-3px)}}

/* ---------- exchange: dark gold theme ---------- */
.sheet.lux{background:linear-gradient(170deg,#2b1030 0%,#1a0a1c 52%,#12070f 100%);color:var(--cream);border-color:#c9a24a;max-height:94%;box-shadow:0 -12px 60px rgba(201,162,74,.28)}
.sheet.lux>header h2{color:#ffe2a8;text-shadow:0 0 16px rgba(255,180,0,.45);font-size:28px}
.sheet.lux .x{background:#c9a24a;color:#1a0a1c}

.mk-auc span{flex:1;min-width:0}.mk-auc b{color:#ffd45a}
.mk-auc .dot{width:9px;height:9px;border-radius:50%;background:#c9a24a;flex:none}
.mk-auc.live .dot{background:#ff2d55;box-shadow:0 0 0 0 rgba(255,45,85,.7);animation:livep 1.2s infinite}
@keyframes livep{70%{box-shadow:0 0 0 9px rgba(255,45,85,0)}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.07);border-radius:15px;padding:4px;gap:4px}
.seg button{padding:11px 4px;border-radius:11px;font-weight:700;font-size:13.5px;color:#d9c9a8}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips button{padding:7px 12px;border-radius:999px;border:1.5px solid rgba(201,162,74,.45);color:#e6d6b4;font-size:12px;font-weight:700;white-space:nowrap}
.chips button.on{background:#c9a24a;color:#1a0a1c;border-color:#c9a24a}
.chips .sort{margin-left:auto;border-style:dashed;color:#ffd45a}
.mk-hero{position:relative;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:10px 12px 10px 6px;border-radius:22px;border:1.5px solid rgba(201,162,74,.7);overflow:hidden;
  background:radial-gradient(90% 130% at 14% 45%,color-mix(in srgb,var(--tc) 55%,transparent),transparent 62%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02))}
.mk-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);transform:translateX(-120%);animation:shine 4s infinite;pointer-events:none}
.mk-hero canvas{width:120px;height:120px}
.mk-hero-t{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.mk-eyebrow{font:700 10.5px/1 var(--f-body);letter-spacing:.14em;color:#c9a24a}
.mk-hero-t>b{font:400 23px/1.05 var(--f-display);color:#fff}
.mk-hero-p{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mk-hero-p span{font:400 27px/1 var(--f-display);color:#ffd45a;font-variant-numeric:tabular-nums}.mk-hero-p small{font-size:11px;color:#b9a58a}
.mk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk-grid .wide,.list .wide{grid-column:1/-1}
.mk-card{position:relative;display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:18px;min-width:0;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1.5px solid color-mix(in srgb,var(--tc) 62%,transparent)}
.enter .mk-card,.enter .ag{animation:mkin .38s both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes mkin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.mk-art{position:relative;aspect-ratio:1.22;border-radius:13px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--tc) 62%,#fff 8%),#1c0b1e 80%)}
.mk-art img{width:72%;height:auto;filter:drop-shadow(0 8px 9px rgba(0,0,0,.45))}
.mk-art .tier{position:absolute;left:6px;top:6px}
.mk-badge{position:absolute;right:6px;top:6px;font:700 11px/1 var(--f-body);padding:4px 6px;border-radius:8px}
.mk-badge.down{background:#22b56b;color:#fff}.mk-badge.up{background:rgba(0,0,0,.55);color:#ffb3bd}
.t-SR .mk-art::after,.t-SSR .mk-art::after,.t-UR .mk-art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.34) 50%,transparent 64%);transform:translateX(-120%);animation:shine 3.4s infinite}

.mk-name{font-size:14px;font-weight:700;line-height:1.2;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-card small{font-size:10.5px;color:#b9a58a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.mk-price{font:400 18px/1 var(--f-display);color:#ffd45a;font-variant-numeric:tabular-nums}

.mk-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a10}

/* calendar + agenda */

.cal button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:13px;border:1.5px solid rgba(201,162,74,.35);color:#d9c9a8;min-width:0}
.cal button small{font-size:10.5px;font-weight:700}.cal button b{font:400 19px/1 var(--f-display);color:#fff}.cal button i{font-style:normal;font-size:9.5px;color:#c9a24a;white-space:nowrap}
.cal button.on{background:linear-gradient(#ffd45a,#e0a61a);border-color:#ffd45a;color:#1a0a1c}.cal button.on b,.cal button.on i{color:#1a0a1c}

.sbody .row>label.l,.sbody .row>span.l{font:700 12px/1.2 var(--f-body);color:var(--mute);letter-spacing:.04em}
.pick{width:100%;font:700 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:11px 10px;min-width:0}
.note.err{color:var(--bad);font-weight:700}
.vip-card{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;border:1.5px solid #ffd45a;background:linear-gradient(135deg,#6e0c1a,#2a060d 60%),#2a060d;box-shadow:inset 0 0 40px rgba(255,212,90,.18)}
.vip-card b{font:400 26px/1 var(--f-display);color:#ffe2a8}.vip-card span{font:400 18px/1 var(--f-display);color:#ffd45a}
.auc-row .btn.violet{padding:12px 6px;font-size:14px}

/* ================= theme v2: noir + gold. One look for every screen; later rules win over the cream originals above ================= */
:root{--mute:#b9a58a;--gold:#ffd45a;--gline:#c9a24a;--line:rgba(201,162,74,.5);--card:rgba(255,255,255,.07);--glass:rgba(26,10,28,.8);--panel:linear-gradient(170deg,#2b1030 0%,#1a0a1c 52%,#12070f 100%)}
.btn{--sh:#7a5a10;color:#1a0a1c;background:linear-gradient(#ffd45a,#e0a61a);border:0;box-shadow:0 4px 0 var(--sh);min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.btn:active{box-shadow:0 1px 0 var(--sh)}
.btn.sm{box-shadow:0 3px 0 var(--sh)}
.btn.pink{--sh:#8e1244;background:linear-gradient(#ff7fa8,#ff4f93);color:#fff}
.btn.aqua{--sh:#0c6e66;background:linear-gradient(#5ff0e2,#1fc4b4);color:#06302c}
.btn.violet{--sh:#3a1f96;background:linear-gradient(#a98cff,#7b4dff);color:#fff}
.btn.ghost,.btn.ghost:active{background:rgba(255,255,255,.09);color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.pill{background:var(--glass);color:var(--gold);border:1.5px solid var(--gline);box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);flex:none}
.coin{border:1.5px solid #7a5a10}
.tier{border:0;font-size:10.5px;padding:3px 7px;white-space:nowrap}
.ico{border:1.5px solid color-mix(in srgb,var(--tc) 70%,transparent);background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--tc) 58%,#fff 10%),#1c0b1e 86%)}
.t-UR.ico{background:conic-gradient(from 0deg,#7a2a4a,#7a6a1a,#1a6a5a,#3a2a7a,#7a2a4a)}
/* HUD */
.hud-top{gap:8px}
.who{background:var(--glass);border:1.5px solid var(--gline);min-width:0;flex:0 1 auto;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.who canvas{border:1.5px solid var(--gline);background:radial-gradient(circle at 50% 30%,#5a1f7e,#1d0f3a);flex:none}
.who span{min-width:0}.who b{max-width:7.5em;color:#ffe2a8}
.ticker{background:rgba(26,10,28,.66);border:1px solid rgba(201,162,74,.32);right:68px}
.side{gap:7px}
.side button{width:48px;height:48px;background:var(--glass);color:#ffe2a8;border:1.5px solid var(--gline);box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.side button:active{transform:translateY(2px);box-shadow:0 1px 6px rgba(0,0,0,.35)}
.side svg{width:21px;height:21px}.side small{font-size:9.5px;white-space:nowrap}
.side .dot{border:0;top:-5px;right:-5px}
.side button.off{background:var(--glass);opacity:.5}
.hint{left:calc(50% - 29px);max-width:calc(100% - 150px);overflow:hidden;text-overflow:ellipsis;background:linear-gradient(#ffd45a,#e0a61a);color:#1a0a1c;border:0;box-shadow:0 3px 0 #7a5a10,0 0 18px rgba(255,196,46,.4)}
.auc{right:68px;border-width:1.5px;box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 24px rgba(201,162,74,.28)}
.auc-top .mid b{min-width:0}.auc-top .mid small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joy{border:1.5px solid rgba(201,162,74,.6);background:rgba(26,10,28,.35)}
.joy i{border:0;background:radial-gradient(circle at 35% 30%,#fff6d6,#ffd45a 60%,#c98f12);box-shadow:0 4px 0 rgba(0,0,0,.45)}
#act{background:linear-gradient(#ff7fa8,#ff4f93);border:0;box-shadow:0 6px 0 #8e1244,0 0 22px rgba(255,79,147,.45)}
#act:active{box-shadow:0 2px 0 #8e1244}
#toasts{top:134px}
#app.in-hall #toasts{top:184px}
.toast{background:rgba(26,10,28,.94);color:var(--cream);border:1.5px solid var(--gline);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.toast.good{background:linear-gradient(#2fcf83,#1c9a5c);color:#fff;border:0}.toast.bad{background:linear-gradient(#ff6b7c,#e23a50);color:#fff;border:0}
/* claw view */
.ibtn,.vbtn{background:var(--glass);color:#ffe2a8;border:1.5px solid var(--gline);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ibtn:active,.vbtn:active{box-shadow:0 1px 6px rgba(0,0,0,.35)}
.go{background:linear-gradient(#ffd45a,#e0a61a);color:#1a0a1c;border:0;box-shadow:0 7px 0 #7a5a10}
.go:active{box-shadow:0 2px 0 #7a5a10}
.go.grab{background:linear-gradient(#ff7fa8,#ff4f93);color:#fff;box-shadow:0 7px 0 #8e1244}
.cmsg{border-color:var(--line)}
/* creator */
.cform{background:var(--panel);color:var(--cream);border:1.5px solid var(--gline);border-bottom:0;box-shadow:0 -12px 50px rgba(201,162,74,.22);padding:14px 14px 6px;gap:10px}
.cform .row{grid-template-columns:34px minmax(0,1fr)}
.cfoot{background:#12070f;border-left:1.5px solid var(--gline);border-right:1.5px solid var(--gline);padding:10px 14px 16px}
.nm input{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid var(--line)}
.nm input::placeholder{color:#8f7f6a}
.sw{flex-wrap:wrap;gap:10px;padding:4px 5px}
.sw button{width:30px;height:30px;border:2px solid rgba(255,255,255,.4);box-shadow:none;flex:none}
.sw button.on{box-shadow:0 0 0 2px #1a0a1c,0 0 0 4.5px var(--gold)}
.ch button{background:var(--card);color:#e6d6b4;border:1.5px solid var(--line);box-shadow:none;flex:none;white-space:nowrap}
.ch button.on{background:linear-gradient(#ffd45a,#e0a61a);color:#1a0a1c;border-color:#ffd45a}
.ch button.worn{background:linear-gradient(#a98cff,#7b4dff);color:#fff;border-color:#a98cff}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
.scroll::-webkit-scrollbar{display:none}
.seg.s2{grid-template-columns:1fr 1fr}.cform .seg button{padding:8px 4px;font-size:13px}
.cform .note{font-size:11.5px}
/* sheets */
.sheet{border-width:1.5px}
.sheet h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.sheet .x{flex:none}
.tabs button,.qrow button{background:var(--card);color:#e6d6b4;border:1.5px solid var(--line)}
.tabs button.on,.qrow button.on{background:linear-gradient(#ffd45a,#e0a61a);color:#1a0a1c;border-color:#ffd45a}
.price{color:var(--gold)}
.sum{color:#e6d6b4;align-items:baseline;gap:10px}.sum .price{font-size:16px}
.cell{background:var(--card);color:var(--cream);border:1.5px solid color-mix(in srgb,var(--tc,#c9a24a) 55%,transparent)}
.cell .ico{border-width:1.5px}
.cell .eq{background:#22b56b;border:0;top:-5px;right:-3px}
.bagtop{grid-template-columns:104px minmax(0,1fr);gap:10px}
.bagpv{position:relative;border-radius:16px;overflow:hidden;border:1.5px solid var(--gline);display:block}
.bagtop .bagpv canvas{width:100%;height:132px;border:0;border-radius:0;background:radial-gradient(circle at 50% 30%,#5a1f7e,#1d0f3a)}
.bagpv span{position:absolute;left:6px;right:6px;bottom:6px;font:700 11px/1 var(--f-body);color:#1a0a1c;background:linear-gradient(#ffd45a,#e0a61a);border-radius:8px;padding:5px 0;text-align:center}
.slots{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{min-height:63px;min-width:0;gap:4px;padding:5px 2px;border:1.5px dashed rgba(201,162,74,.38);background:rgba(255,255,255,.04);color:var(--mute);font-size:10px}
.slot span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.slot i{width:22px;height:22px;border-radius:50%;border:1.5px dashed rgba(201,162,74,.45)}
.slot.has{border:1.5px solid color-mix(in srgb,var(--tc) 70%,transparent);background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--tc) 48%,transparent),rgba(255,255,255,.04) 78%);color:#fff}
.slot img{width:34px;height:34px}
.kv div{background:var(--card);border:1.5px solid var(--line);min-width:0}
.kv dt{color:var(--mute)}.kv dd{color:var(--gold)}
.wbox .kv{color:var(--cream)}

/* ---------- ticker & market simulation ---------- */
const Ticker={q:[],t:1.5,
  push(html,front){if(front)this.q.unshift(html);else if(this.q.length<6)this.q.push(html);},
  bot(){const m=pick(MACHINES),r=Math.random(),want=r<.6?'N':r<.86?'R':r<.97?'SR':'SSR',pool=m.pool.map(p=>ITEMS[p[0]]),c=pool.filter(i=>i.tier===want),it=c.length?pick(c):pool[0];return `<u>${esc(pick(NAMES))}</u> 在【${m.name}】夹到 ${it.n} <b>成本 ${fmt(it.cost)}</b>`;},
  tick(dt){this.t-=dt;if(this.t>0)return;this.t=3.6;const h=this.q.length?this.q.shift():this.bot(),sp=$('#ticker span');sp.innerHTML=h;sp.classList.remove('in');void sp.offsetWidth;sp.classList.add('in');},
};
const Market={bots:[],n:0,acc:0,
  roll(){const w={N:44,R:28,SR:19,SSR:8,UR:1},ids=Object.keys(ITEMS);let tot=0;ids.forEach(id=>tot+=w[ITEMS[id].tier]);let r=Math.random()*tot;for(const id of ids){r-=w[ITEMS[id].tier];if(r<=0)return id;}return ids[0];},
  add(){const id=this.roll(),cost=ITEMS[id].cost;this.bots.unshift({lid:++this.n,id,price:Math.max(1,Math.round(cost*rand(.72,1.75))),seller:pick(NAMES)});if(this.bots.length>18)this.bots.pop();},
  init(){for(let i=0;i<14;i++)this.add();},
  chance(L){const r=L.price/ITEMS[L.id].cost;return r<=.7?.6:r<=1?.34:r<=1.3?.16:r<=2?.06:r<=3?.018:.003;},
  tick(dt){
    this.acc+=dt;if(this.acc<4)return;this.acc=0;let ch=false;
    if(Math.random()<.3&&this.bots.length>8){const b=this.bots.splice(randi(0,this.bots.length-1),1)[0];Ticker.push(`<u>${esc(pick(NAMES))}</u> 在交易所买走 ${ITEMS[b.id].n} <b>${fmt(b.price)}</b>`);ch=true;}
    if(Math.random()<.45){this.add();ch=true;}
    for(let i=S.listings.length-1;i>=0;i--){const L=S.listings[i];if(Date.now()-L.t<5000)continue;if(Math.random()<this.chance(L)){
      S.listings.splice(i,1);const net=r2(L.price*(1-FEE)),buyer=pick(NAMES);setBal(net);Snd.sell();toast(`${ITEMS[L.id].n} 被 ${buyer} 买走，到账 ${fmt(net)}`,'good');
      Ticker.push(`<u>${esc(buyer)}</u> 买走了 <u>${esc(S.name)}</u> 的 ${ITEMS[L.id].n} <b>${fmt(L.price)}</b>`,true);FX.confetti(FX.W/2,FX.H*.3,40,.7);ch=true;UI.refresh();}}
    if(ch){UI.marketRefresh();Hall.syncCases();}
  },
};
